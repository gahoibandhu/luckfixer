<style>

  p{margin:0 0 18px;font-size:15px;line-height:1.7;color:#4A5578}
  button{width:100%;padding:14px 20px;font-size:16px;font-weight:700;color:#2A1600;background:linear-gradient(180deg,#FFD23F,#FF9A00);border:0;border-radius:14px;cursor:pointer;box-shadow:0 8px 20px rgba(255,154,0,.35)}
  button:active{transform:translateY(1px);opacity:.9}
  .tag{margin:14px 0 0;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:#6A74A0}
  .tag b{color:#0A8FD6}
